<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>节点画布</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4efe4;
        --paper-raised: #fbf8f0;
        --paper-sunken: #efe8da;
        --ink: #34312b;
        --ink-soft: #6f6a60;
        --ink-faint: #857c6f;
        --rule: #ddd4c4;
        --rule-strong: #cfc4b1;
        --accent: #4d6670;
        --accent-soft: rgba(77, 102, 112, 0.12);
        --seal: #a65a45;
        --danger: #964a36;
        --font: "Noto Sans CJK SC", "Noto Sans SC", system-ui, -apple-system, "Microsoft YaHei",
          sans-serif;
        --serif: "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      body.android {
        --safe-top: 0px;
        --safe-bottom: 0px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
      }

      body {
        font-family: var(--font);
        color: var(--ink);
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      canvas {
        display: block;
        touch-action: none;
        cursor: default;
        background: var(--paper);
      }

      body.connecting canvas {
        cursor: crosshair;
      }

      .topbar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 10;
        padding: calc(var(--safe-top) + 14px) 20px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 15px;
        letter-spacing: 0.16em;
      }

      .brand b {
        font-weight: 600;
      }

      .brand i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--seal);
      }

      .zoom {
        color: var(--ink-soft);
        font-size: 11px;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      .canvas-switch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 30px;
        max-width: 132px;
        padding: 0 9px;
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: rgba(251, 247, 239, 0.72);
        color: var(--ink-soft);
        font-family: var(--font);
        font-size: 11px;
        letter-spacing: 0.04em;
        pointer-events: auto;
        touch-action: manipulation;
      }

      .canvas-switch:active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .canvas-switch svg {
        flex: none;
        width: 10px;
        height: 10px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #canvas-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu {
        max-height: 62vh;
        overflow-y: auto;
      }

      .menu-item.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .hint {
        position: fixed;
        top: calc(var(--safe-top) + 48px);
        left: 50%;
        z-index: 12;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: calc(100vw - 32px);
        padding: 5px 7px 5px 11px;
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: rgba(250, 246, 238, 0.78);
        color: var(--ink-soft);
        font-family: var(--serif);
        font-size: 11.5px;
        letter-spacing: 0.04em;
        white-space: nowrap;
        pointer-events: none;
      }

      .hint.hidden {
        display: none;
      }

      .hint button {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 2px;
        background: transparent;
        color: var(--ink-faint);
        font-size: 14px;
        line-height: 1;
        pointer-events: auto;
        touch-action: manipulation;
      }

      .toolbar {
        position: fixed;
        left: 50%;
        bottom: calc(var(--safe-bottom) + 14px);
        z-index: 20;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0;
        padding: 5px 6px;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: rgba(251, 247, 239, 0.94);
        box-shadow: 0 8px 24px rgba(80, 65, 45, 0.08);
        backdrop-filter: blur(6px);
      }

      .toolbar button {
        width: 40px;
        height: 42px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink-soft);
        transition:
          background 0.15s ease,
          color 0.15s ease,
          opacity 0.15s ease;
        touch-action: manipulation;
      }

      .toolbar button:active {
        background: rgba(80, 65, 45, 0.06);
      }

      .toolbar button.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .toolbar button:disabled {
        opacity: 0.25;
      }

      .toolbar svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .toolbar .sep {
        align-self: center;
        width: 1px;
        height: 18px;
        margin: 0 3px;
        background: var(--rule);
      }

      #editor {
        position: fixed;
        z-index: 30;
        display: none;
        min-width: 60px;
        min-height: 44px;
        border: 1.5px solid var(--accent);
        outline: none;
        resize: none;
        overflow: hidden;
        background: var(--paper-raised);
        color: var(--ink);
        font-family: var(--font);
        caret-color: var(--accent);
        box-shadow: 0 8px 22px rgba(80, 65, 45, 0.1);
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }

      #editor.show {
        display: block;
      }

      #editor-done {
        position: fixed;
        top: calc(var(--safe-top) + 12px);
        right: 14px;
        z-index: 40;
        display: none;
        height: 32px;
        padding: 0 15px;
        border: 0;
        border-radius: 6px;
        background: var(--ink);
        color: var(--paper-raised);
        font-family: var(--font);
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.08em;
        box-shadow: none;
        touch-action: manipulation;
      }

      #editor-done.show {
        display: block;
      }

      .menu {
        position: fixed;
        z-index: 50;
        min-width: 200px;
        max-width: calc(100vw - 24px);
        padding: 5px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--paper-raised);
        box-shadow: 0 12px 30px rgba(80, 65, 45, 0.12);
      }

      .menu[hidden] {
        display: none;
      }

      .menu-item {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 10px 11px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font-family: var(--font);
        font-size: 13.5px;
        text-align: left;
        touch-action: manipulation;
      }

      .menu-item:active {
        background: rgba(80, 65, 45, 0.06);
      }

      .menu-item.danger {
        color: var(--danger);
      }

      .menu-label {
        padding: 8px 11px 3px;
        color: var(--ink-soft);
        font-size: 10.5px;
        letter-spacing: 0.08em;
      }

      .swatches {
        display: flex;
        gap: 8px;
        padding: 6px 11px 9px;
      }

      .swatch {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 50%;
        touch-action: manipulation;
      }

      .swatch.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-soft);
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(var(--safe-bottom) + 82px);
        z-index: 60;
        max-width: calc(100vw - 48px);
        padding: 8px 14px;
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--paper-raised);
        color: var(--ink);
        font-size: 12.5px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(8px);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
        box-shadow: 0 6px 18px rgba(80, 65, 45, 0.08);
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .empty {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: grid;
        place-content: center;
        gap: 10px;
        text-align: center;
        color: var(--ink-soft);
        pointer-events: none;
      }

      .empty[hidden] {
        display: none;
      }

      .empty .title {
        color: var(--ink-soft);
        font-family: var(--serif);
        font-size: 20px;
        letter-spacing: 0.12em;
      }

      .empty .rule {
        width: 36px;
        height: 1px;
        margin: 0 auto;
        background: var(--rule-strong);
      }

      .empty .sub {
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      button:focus-visible {
        outline: 1.5px solid var(--accent);
        outline-offset: 2px;
      }

      @media (hover: hover) {
        .toolbar button:hover {
          background: rgba(80, 65, 45, 0.05);
        }

        .menu-item:hover {
          background: rgba(80, 65, 45, 0.05);
        }

        .hint button:hover {
          color: var(--ink);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 420px) {
        .hint {
          font-size: 11px;
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="empty" id="empty" hidden>
      <div class="title">纸上还空着</div>
      <div class="rule"></div>
      <div class="sub">双击空白，写下第一个想法</div>
    </div>

    <header class="topbar">
      <div class="topbar-left">
        <div class="brand"><i></i><b>画布</b></div>
        <button id="btn-canvas" class="canvas-switch" type="button" aria-label="切换或新建画布">
          <span id="canvas-name">画布 1</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
        </button>
      </div>
      <div class="zoom" id="zoom">100%</div>
    </header>

    <div class="hint" id="hint">
      <span id="hint-text">双击空白新建 · 长按拖动框选 · 双指缩放</span>
      <button id="hint-close" aria-label="关闭提示">×</button>
    </div>

    <nav class="toolbar" aria-label="画布工具栏">
      <button id="btn-add" aria-label="新建节点" title="新建节点">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button id="btn-connect" aria-label="连线模式" title="连线模式">
        <svg viewBox="0 0 24 24">
          <circle cx="7" cy="17" r="2.6" />
          <circle cx="17" cy="7" r="2.6" />
          <path d="M9 15 15 9" />
        </svg>
      </button>
      <button id="btn-group" aria-label="将选中节点分组" title="将选中节点分组" disabled>
        <svg viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2" />
          <circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-delete" aria-label="删除选中节点" title="删除选中节点" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v5M14 11v5" />
        </svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-undo" aria-label="撤销" title="撤销" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h9a6 6 0 0 1 6 6" /></svg>
      </button>
      <button id="btn-redo" aria-label="重做" title="重做" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12h-9a6 6 0 0 0-6 6" /></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-more" aria-label="更多" title="更多">
        <svg viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
          <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
    </nav>

    <textarea id="editor" spellcheck="false" aria-label="编辑节点文字"></textarea>
    <button id="editor-done" type="button">完成</button>
    <div id="menu" class="menu" hidden></div>
    <div id="toast" class="toast" role="status"></div>
    <input id="file-input" type="file" accept="application/json,.json" hidden />

    <script>
      (() => {
        "use strict";

        const canvas = document.getElementById("stage");
        const ctx = canvas.getContext("2d");
        const editor = document.getElementById("editor");
        const doneBtn = document.getElementById("editor-done");
        const menuEl = document.getElementById("menu");
        const hintEl = document.getElementById("hint");
        const hintText = document.getElementById("hint-text");
        const toastEl = document.getElementById("toast");
        const fileInput = document.getElementById("file-input");
        const zoomEl = document.getElementById("zoom");
        const emptyEl = document.getElementById("empty");
        const canvasBtn = document.getElementById("btn-canvas");
        const canvasNameEl = document.getElementById("canvas-name");
        const addBtn = document.getElementById("btn-add");
        const connectBtn = document.getElementById("btn-connect");
        const groupBtn = document.getElementById("btn-group");
        const deleteBtn = document.getElementById("btn-delete");
        const undoBtn = document.getElementById("btn-undo");
        const redoBtn = document.getElementById("btn-redo");
        const moreBtn = document.getElementById("btn-more");

        const FONT_FAMILY =
          '"Noto Sans CJK SC", "Noto Sans SC", system-ui, -apple-system, "Microsoft YaHei", sans-serif';
        const FONT = "16px " + FONT_FAMILY;
        const FONT_SIZE = 16;
        const LINE_HEIGHT = 26;
        const PAD_X = 18;
        const PAD_Y = 16;
        const MIN_W = 160;
        const MAX_W = 280;
        const MIN_H = 52;
        const GROUP_PAD = 24;
        const GROUP_TITLE_HEIGHT = 42;
        const GROUP_TITLE_FONT = 13;
        const GROUP_COLLAPSED_HEIGHT = 30;
        const NODE_COLORS = ["#fbf8f0", "#f4ead8", "#e9efe3", "#f3e4df", "#e5edf0", "#eee7ee"];
        const COLORS = {
          paper: "#f4efe4",
          ink: "#34312b",
          inkSoft: "#6f6a60",
          rule: "rgba(70, 60, 45, 0.14)",
          accent: "#4d6670",
          edge: "rgba(70, 64, 55, 0.58)",
          edgeActive: "rgba(77, 102, 112, 0.8)",
          dot: "rgba(110, 100, 84, 0.18)",
          dotAxis: "rgba(110, 100, 84, 0.3)",
          shadow: "rgba(80, 65, 45, 0.055)",
        };
        const LEGACY_STORAGE_KEY = "node-canvas-doc-v1";
        const STORAGE_INDEX_KEY = "node-canvas-index-v2";
        const STORAGE_DOC_PREFIX = "node-canvas-doc-v2:";

        const doc = { nodes: [], edges: [], groups: [] };
        const cam = { x: 0, y: 0, scale: 1 };
        const viewport = { w: 1, h: 1, dpr: 1 };
        const history = { states: [], index: 0 };

        let selectedIds = new Set();
        let marquee = null;
        let draggingNodeIds = new Set();
        let draggingOrigins = new Map();
        let mode = "select";
        let connectFrom = null;
        let editing = null;
        let gesture = null;
        let pinch = null;
        let longPressTimer = null;
        let longPressed = false;
        let suppressTap = false;
        let lastTap = null;
        let rafId = 0;
        let saveTimer = null;
        let storageWarned = false;
        let canvasIndex = [];
        let activeCanvasId = null;
        let toastTimer = null;
        const pointers = new Map();
        let paperPattern = null;

        function isSelected(id) {
          return selectedIds.has(id);
        }

        function selectedNodeList() {
          return doc.nodes.filter((node) => selectedIds.has(node.id));
        }

        function selectedGroupList() {
          return doc.groups.filter((group) => selectedIds.has(group.id));
        }

        function selectOnly(id) {
          selectedIds = new Set(id ? [id] : []);
          updateUI();
          requestRender();
        }

        function clearSelection() {
          selectedIds.clear();
          updateUI();
          requestRender();
        }

        function uid() {
          if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          return "id-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function clampScale(scale) {
          return clamp(scale, 0.01, 128);
        }

        function nodeById(id) {
          if (!id) return null;
          return doc.nodes.find((n) => n.id === id) || null;
        }

        function worldToScreen(x, y) {
          return { x: x * cam.scale + cam.x, y: y * cam.scale + cam.y };
        }

        function screenToWorld(x, y) {
          return { x: (x - cam.x) / cam.scale, y: (y - cam.y) / cam.scale };
        }

        function makePaperPattern() {
          const size = 220;
          const tile = document.createElement("canvas");
          tile.width = size;
          tile.height = size;
          const g = tile.getContext("2d");
          const image = g.createImageData(size, size);
          for (let i = 0; i < size * size; i++) {
            const alpha = Math.random() < 0.14 ? 3 + Math.random() * 7 : 0;
            const value = 95 + Math.random() * 35;
            image.data[i * 4] = value;
            image.data[i * 4 + 1] = value - 6;
            image.data[i * 4 + 2] = value - 16;
            image.data[i * 4 + 3] = alpha;
          }
          g.putImageData(image, 0, 0);
          g.strokeStyle = "rgba(120, 105, 85, 0.05)";
          g.lineWidth = 1;
          for (let i = 0; i < 80; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x + 4 + Math.random() * 10, y + (Math.random() - 0.5) * 0.6);
            g.stroke();
          }
          paperPattern = ctx.createPattern(tile, "repeat");
        }

        function requestRender() {
          if (rafId) return;
          rafId = requestAnimationFrame(() => {
            rafId = 0;
            render();
          });
        }

        function roundRectPath(c, x, y, w, h, r) {
          const rr = Math.max(0, Math.min(r, w / 2, h / 2));
          c.beginPath();
          c.moveTo(x + rr, y);
          c.arcTo(x + w, y, x + w, y + h, rr);
          c.arcTo(x + w, y + h, x, y + h, rr);
          c.arcTo(x, y + h, x, y, rr);
          c.arcTo(x, y, x + w, y, rr);
          c.closePath();
        }

        function wrapText(text, width) {
          ctx.font = FONT;
          const lines = [];
          const paragraphs = String(text).split("\n");
          for (const paragraph of paragraphs) {
            if (paragraph === "") {
              lines.push("");
              continue;
            }
            let line = "";
            for (const ch of Array.from(paragraph)) {
              const next = line + ch;
              if (line && ctx.measureText(next).width > width) {
                lines.push(line);
                line = ch;
              } else {
                line = next;
              }
            }
            lines.push(line);
          }
          return lines.length ? lines : [""];
        }

        function layoutNode(node, resizeWidth) {
          ctx.font = FONT;
          const text = String(node.text || "");
          if (resizeWidth) {
            let widest = 0;
            for (const paragraph of text.split("\n")) {
              widest = Math.max(widest, ctx.measureText(paragraph).width);
            }
            node.w = clamp(Math.ceil(widest + PAD_X * 2), MIN_W, MAX_W);
          }
          node.w = clamp(Number(node.w) || MIN_W, MIN_W, MAX_W);
          node.lines = wrapText(text, node.w - PAD_X * 2);
          node.h = Math.max(MIN_H, node.lines.length * LINE_HEIGHT + PAD_Y * 2);
        }

        function normalizeNode(raw) {
          return {
            id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
            x: Number.isFinite(raw.x) ? raw.x : 0,
            y: Number.isFinite(raw.y) ? raw.y : 0,
            w: Number.isFinite(raw.w) ? raw.w : MIN_W,
            h: Number.isFinite(raw.h) ? raw.h : MIN_H,
            text: typeof raw.text === "string" ? raw.text : "",
            color: NODE_COLORS.includes(raw.color) ? raw.color : NODE_COLORS[0],
            parentId: typeof raw.parentId === "string" && raw.parentId ? raw.parentId : null,
            lines: [],
          };
        }

        function normalizeEdge(raw) {
          return {
            id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
            from: String(raw.from || ""),
            to: String(raw.to || ""),
          };
        }

        function normalizeGroup(raw) {
          return {
            id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
            title:
              typeof raw.title === "string" && raw.title.trim() ? raw.title.trim() : "分组",
            parentId: typeof raw.parentId === "string" && raw.parentId ? raw.parentId : null,
            collapsed: !!raw.collapsed,
          };
        }

        function groupById(id) {
          if (!id) return null;
          return doc.groups.find((group) => group.id === id) || null;
        }

        function directChildNodes(groupId) {
          return doc.nodes.filter((node) => node.parentId === groupId);
        }

        function directChildGroups(groupId) {
          return doc.groups.filter((group) => group.parentId === groupId);
        }

        function descendantNodes(groupId) {
          const result = [];
          const walk = (id) => {
            for (const node of directChildNodes(id)) result.push(node);
            for (const group of directChildGroups(id)) walk(group.id);
          };
          walk(groupId);
          return result;
        }

        function descendantCount(groupId) {
          let count = directChildNodes(groupId).length;
          for (const group of directChildGroups(groupId)) {
            count += 1 + descendantCount(group.id);
          }
          return count;
        }

        function isNodeHidden(node) {
          let parentId = node.parentId;
          const seen = new Set();
          while (parentId && !seen.has(parentId)) {
            seen.add(parentId);
            const group = groupById(parentId);
            if (!group) return false;
            if (group.collapsed) return true;
            parentId = group.parentId;
          }
          return false;
        }

        function isGroupHidden(group) {
          let parentId = group.parentId;
          const seen = new Set();
          while (parentId && !seen.has(parentId)) {
            seen.add(parentId);
            const parent = groupById(parentId);
            if (!parent) return false;
            if (parent.collapsed) return true;
            parentId = parent.parentId;
          }
          return false;
        }

        function groupDepth(group) {
          let depth = 0;
          let parentId = group.parentId;
          const seen = new Set();
          while (parentId && !seen.has(parentId)) {
            seen.add(parentId);
            depth += 1;
            const parent = groupById(parentId);
            if (!parent) break;
            parentId = parent.parentId;
          }
          return depth;
        }

        function sanitizeGroups() {
          const ids = new Set(doc.groups.map((group) => group.id));
          for (const group of doc.groups) {
            if (group.parentId === group.id || (group.parentId && !ids.has(group.parentId))) {
              group.parentId = null;
            }
          }
          for (const group of doc.groups) {
            const seen = new Set([group.id]);
            let parentId = group.parentId;
            while (parentId) {
              if (seen.has(parentId)) {
                group.parentId = null;
                break;
              }
              seen.add(parentId);
              const parent = groupById(parentId);
              if (!parent) {
                group.parentId = null;
                break;
              }
              parentId = parent.parentId;
            }
          }
          const groupIds = new Set(doc.groups.map((group) => group.id));
          for (const node of doc.nodes) {
            if (node.parentId && !groupIds.has(node.parentId)) node.parentId = null;
          }
        }

        function ancestorChain(groupId) {
          const chain = [];
          let group = groupById(groupId);
          const seen = new Set();
          while (group && !seen.has(group.id)) {
            seen.add(group.id);
            chain.push(group);
            group = group.parentId ? groupById(group.parentId) : null;
          }
          return chain;
        }

        function commonParentForNodes(nodes) {
          if (!nodes.length) return null;
          const chains = nodes.map((node) => ancestorChain(node.parentId));
          const first = chains[0];
          for (const candidate of first) {
            if (chains.every((chain) => chain.some((group) => group.id === candidate.id))) {
              return candidate.id;
            }
          }
          return null;
        }

        // ---------- 渲染 ----------

        function render() {
          const { w, h, dpr } = viewport;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = COLORS.paper;
          ctx.fillRect(0, 0, w, h);
          if (paperPattern) {
            ctx.fillStyle = paperPattern;
            ctx.fillRect(0, 0, w, h);
          }
          drawDots();
          const groupBounds = computeGroupBounds();
          drawGroups(groupBounds);
          drawEdges();
          drawNodes();
          drawCollapsedGroups(groupBounds);
          drawSelection(groupBounds);
          drawMarquee();
          const zoomText = Math.round(cam.scale * 100) + "%";
          if (zoomEl.textContent !== zoomText) zoomEl.textContent = zoomText;
        }

        function drawDots() {
          let spacing = 32;
          while (spacing * cam.scale < 20) spacing *= 2;
          while (spacing * cam.scale > 80) spacing /= 2;

          const topLeft = screenToWorld(0, 0);
          const bottomRight = screenToWorld(viewport.w, viewport.h);
          const startX = Math.floor(topLeft.x / spacing) * spacing;
          const startY = Math.floor(topLeft.y / spacing) * spacing;

          ctx.fillStyle = COLORS.dot;
          for (let x = startX; x <= bottomRight.x; x += spacing) {
            for (let y = startY; y <= bottomRight.y; y += spacing) {
              const axis = Math.abs(x) < spacing * 0.25 || Math.abs(y) < spacing * 0.25;
              if (axis) continue;
              const sx = x * cam.scale + cam.x;
              const sy = y * cam.scale + cam.y;
              ctx.fillRect(sx - 0.55, sy - 0.55, 1.1, 1.1);
            }
          }

          ctx.fillStyle = COLORS.dotAxis;
          for (let x = startX; x <= bottomRight.x; x += spacing) {
            for (let y = startY; y <= bottomRight.y; y += spacing) {
              const axis = Math.abs(x) < spacing * 0.25 || Math.abs(y) < spacing * 0.25;
              if (!axis) continue;
              const sx = x * cam.scale + cam.x;
              const sy = y * cam.scale + cam.y;
              ctx.fillRect(sx - 1.1, sy - 1.1, 2.2, 2.2);
            }
          }
        }

        function borderPoint(node, towardX, towardY) {
          const cx = node.x + node.w / 2;
          const cy = node.y + node.h / 2;
          const dx = towardX - cx;
          const dy = towardY - cy;
          const len = Math.hypot(dx, dy);
          if (len < 0.001) return { x: cx, y: cy };
          const ux = dx / len;
          const uy = dy / len;
          const tx = ux !== 0 ? node.w / 2 / Math.abs(ux) : Infinity;
          const ty = uy !== 0 ? node.h / 2 / Math.abs(uy) : Infinity;
          const t = Math.min(tx, ty);
          return { x: cx + ux * t, y: cy + uy * t };
        }

        function computeGroupBounds() {
          const memo = new Map();
          const chipMemo = new Map();
          const visiting = new Set();
          const exclude = draggingNodeIds;

          function expanded(group) {
            if (memo.has(group.id)) return memo.get(group.id);
            if (visiting.has(group.id)) return null;
            visiting.add(group.id);
            let minX = Infinity;
            let minY = Infinity;
            let maxX = -Infinity;
            let maxY = -Infinity;
            let has = false;
            const addRect = (rect) => {
              if (!rect) return;
              has = true;
              minX = Math.min(minX, rect.x);
              minY = Math.min(minY, rect.y);
              maxX = Math.max(maxX, rect.x + rect.w);
              maxY = Math.max(maxY, rect.y + rect.h);
            };
            for (const node of directChildNodes(group.id)) {
              if (exclude.has(node.id)) continue;
              addRect({ x: node.x, y: node.y, w: node.w, h: node.h });
            }
            for (const child of directChildGroups(group.id)) {
              addRect(child.collapsed ? collapsed(child) : expanded(child));
            }
            const rect = has
              ? {
                  x: minX - GROUP_PAD,
                  y: minY - GROUP_TITLE_HEIGHT - GROUP_PAD,
                  w: maxX - minX + GROUP_PAD * 2,
                  h: maxY - minY + GROUP_TITLE_HEIGHT + GROUP_PAD * 2,
                }
              : null;
            visiting.delete(group.id);
            memo.set(group.id, rect);
            return rect;
          }

          function collapsed(group) {
            if (chipMemo.has(group.id)) return chipMemo.get(group.id);
            const base = expanded(group);
            if (!base) return null;
            ctx.font = "600 " + GROUP_TITLE_FONT + "px " + FONT_FAMILY;
            const text = group.title + " · " + descendantCount(group.id);
            const chip = {
              x: base.x,
              y: base.y,
              w: Math.max(110, ctx.measureText(text).width + 26),
              h: GROUP_COLLAPSED_HEIGHT,
            };
            chipMemo.set(group.id, chip);
            return chip;
          }

          for (const group of doc.groups) {
            expanded(group);
            collapsed(group);
          }
          return {
            expanded: (id) => memo.get(id) || null,
            chip: (id) => chipMemo.get(id) || null,
          };
        }

        function drawGroups(bounds) {
          const groups = doc.groups.slice().sort((a, b) => groupDepth(a) - groupDepth(b));
          ctx.textBaseline = "top";
          for (const group of groups) {
            if (isGroupHidden(group) || group.collapsed) continue;
            const rect = bounds.expanded(group.id);
            if (!rect) continue;
            const p = worldToScreen(rect.x, rect.y);
            const w = rect.w * cam.scale;
            const h = rect.h * cam.scale;
            if (p.x + w < -20 || p.y + h < -20 || p.x > viewport.w + 20 || p.y > viewport.h + 20) {
              continue;
            }
            const depth = groupDepth(group);
            roundRectPath(ctx, p.x, p.y, w, h, Math.max(3, 12 * cam.scale));
            ctx.fillStyle = depth
              ? "rgba(77, 102, 112, 0.03)"
              : "rgba(77, 102, 112, 0.05)";
            ctx.fill();
            ctx.strokeStyle = depth
              ? "rgba(77, 102, 112, 0.18)"
              : "rgba(77, 102, 112, 0.3)";
            ctx.lineWidth = 1;
            ctx.stroke();

            const fontSize = GROUP_TITLE_FONT * cam.scale;
            if (fontSize > 0.5) {
              ctx.font = "600 " + fontSize + "px " + FONT_FAMILY;
              ctx.fillStyle = depth
                ? "rgba(111, 106, 96, 0.88)"
                : "rgba(77, 102, 112, 0.92)";
              ctx.fillText(group.title, p.x + 14 * cam.scale, p.y + 12 * cam.scale);
            }
          }
        }

        function drawCollapsedGroups(bounds) {
          const groups = doc.groups.slice().sort((a, b) => groupDepth(a) - groupDepth(b));
          for (const group of groups) {
            if (isGroupHidden(group) || !group.collapsed) continue;
            const rect = bounds.chip(group.id);
            if (!rect) continue;
            const p = worldToScreen(rect.x, rect.y);
            const w = rect.w * cam.scale;
            const h = rect.h * cam.scale;
            const radius = Math.max(3, 8 * cam.scale);
            roundRectPath(ctx, p.x + 1, p.y + 1.5, w, h, radius);
            ctx.fillStyle = COLORS.shadow;
            ctx.fill();
            roundRectPath(ctx, p.x, p.y, w, h, radius);
            ctx.fillStyle = "#fbf8f0";
            ctx.fill();
            ctx.strokeStyle = "rgba(77, 102, 112, 0.4)";
            ctx.lineWidth = 1;
            ctx.stroke();
            const fontSize = GROUP_TITLE_FONT * cam.scale;
            if (fontSize > 0.5) {
              ctx.font = "600 " + fontSize + "px " + FONT_FAMILY;
              ctx.fillStyle = COLORS.ink;
              ctx.textBaseline = "top";
              ctx.fillText(
                group.title + " · " + descendantCount(group.id),
                p.x + 11 * cam.scale,
                p.y + 7 * cam.scale,
              );
            }
          }
        }

        function edgeScreenPoints(edge) {
          const a = nodeById(edge.from);
          const b = nodeById(edge.to);
          if (!a || !b) return null;
          const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 };
          const bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
          const startWorld = borderPoint(a, bc.x, bc.y);
          const endWorld = borderPoint(b, ac.x, ac.y);
          const p1 = worldToScreen(startWorld.x, startWorld.y);
          const p2 = worldToScreen(endWorld.x, endWorld.y);
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const length = Math.hypot(dx, dy) || 1;
          let parity = 0;
          for (let i = 0; i < edge.id.length; i++) parity = (parity + edge.id.charCodeAt(i)) % 2;
          const bend = Math.min(34, Math.max(6, length * 0.055)) * (parity === 0 ? 1 : -1);
          return {
            p1,
            p2,
            control: {
              x: (p1.x + p2.x) / 2 - (dy / length) * bend,
              y: (p1.y + p2.y) / 2 + (dx / length) * bend,
            },
          };
        }

        function quadraticPoint(p1, control, p2, t) {
          const mt = 1 - t;
          return {
            x: mt * mt * p1.x + 2 * mt * t * control.x + t * t * p2.x,
            y: mt * mt * p1.y + 2 * mt * t * control.y + t * t * p2.y,
          };
        }

        function hitEdge(sx, sy) {
          for (let i = doc.edges.length - 1; i >= 0; i--) {
            const edge = doc.edges[i];
            const a = nodeById(edge.from);
            const b = nodeById(edge.to);
            if (!a || !b || isNodeHidden(a) || isNodeHidden(b)) continue;
            const points = edgeScreenPoints(edge);
            if (!points) continue;
            let closest = Infinity;
            for (let step = 0; step <= 18; step++) {
              const point = quadraticPoint(points.p1, points.control, points.p2, step / 18);
              closest = Math.min(closest, Math.hypot(sx - point.x, sy - point.y));
            }
            if (closest <= 12) return edge;
          }
          return null;
        }

        function drawEdges() {
          for (const edge of doc.edges) {
            const a = nodeById(edge.from);
            const b = nodeById(edge.to);
            if (!a || !b || isNodeHidden(a) || isNodeHidden(b)) continue;
            const points = edgeScreenPoints(edge);
            if (!points) continue;
            const { p1, p2, control } = points;
            const active = isSelected(edge.from) || isSelected(edge.to);
            const color = active ? COLORS.edgeActive : COLORS.edge;

            ctx.strokeStyle = color;
            ctx.lineWidth = active ? 1.8 : 1.25;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.quadraticCurveTo(control.x, control.y, p2.x, p2.y);
            ctx.stroke();

            const screenLength = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (screenLength > 6) {
              const angle = Math.atan2(p2.y - control.y, p2.x - control.x);
              const size = clamp(screenLength * 0.12, 3, 9);
              ctx.beginPath();
              ctx.moveTo(p2.x - Math.cos(angle - 0.5) * size, p2.y - Math.sin(angle - 0.5) * size);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p2.x - Math.cos(angle + 0.5) * size, p2.y - Math.sin(angle + 0.5) * size);
              ctx.stroke();
            }
          }
        }

        function drawNodes() {
          ctx.textBaseline = "top";
          for (const node of doc.nodes) {
            if (isNodeHidden(node)) continue;
            const p = worldToScreen(node.x, node.y);
            const w = node.w * cam.scale;
            const h = node.h * cam.scale;
            if (p.x + w < -24 || p.y + h < -24 || p.x > viewport.w + 24 || p.y > viewport.h + 24) continue;

            const radius = Math.max(3, 10 * cam.scale);
            roundRectPath(ctx, p.x + 1.5, p.y + 2.5, w, h, radius);
            ctx.fillStyle = COLORS.shadow;
            ctx.fill();

            roundRectPath(ctx, p.x, p.y, w, h, radius);
            ctx.fillStyle = node.color;
            ctx.fill();
            ctx.strokeStyle = COLORS.rule;
            ctx.lineWidth = 1;
            ctx.stroke();

            // 不设最小字号：缩小时继续绘制，避免文字整段消失
            const fontSize = FONT_SIZE * cam.scale;
            ctx.font = fontSize + "px " + FONT_FAMILY;
            ctx.fillStyle = COLORS.ink;
            const padX = PAD_X * cam.scale;
            const padY = PAD_Y * cam.scale;
            const lineHeight = LINE_HEIGHT * cam.scale;
            const lines = node.lines || [];
            for (let i = 0; i < lines.length; i++) {
              ctx.fillText(lines[i], p.x + padX, p.y + padY + i * lineHeight);
            }
          }
        }

        function drawSelection(groupBounds) {
          for (const node of selectedNodeList()) {
            const p = worldToScreen(node.x, node.y);
            const w = node.w * cam.scale;
            const h = node.h * cam.scale;
            ctx.strokeStyle = COLORS.accent;
            ctx.lineWidth = 1.5;
            roundRectPath(ctx, p.x - 3, p.y - 3, w + 6, h + 6, Math.max(4, 12 * cam.scale));
            ctx.stroke();
          }

          for (const group of selectedGroupList()) {
            if (isGroupHidden(group)) continue;
            const rect = group.collapsed
              ? groupBounds.chip(group.id)
              : groupBounds.expanded(group.id);
            if (!rect) continue;
            const p = worldToScreen(rect.x, rect.y);
            const w = rect.w * cam.scale;
            const h = rect.h * cam.scale;
            ctx.strokeStyle = COLORS.accent;
            ctx.lineWidth = 1.5;
            roundRectPath(ctx, p.x - 3, p.y - 3, w + 6, h + 6, Math.max(4, 14 * cam.scale));
            ctx.stroke();
          }

          if (mode === "connect" && connectFrom) {
            const node = nodeById(connectFrom);
            if (node) {
              const p = worldToScreen(node.x, node.y);
              const w = node.w * cam.scale;
              const h = node.h * cam.scale;
              ctx.setLineDash([5, 4]);
              ctx.strokeStyle = "rgba(77, 102, 112, 0.5)";
              roundRectPath(ctx, p.x - 7, p.y - 7, w + 14, h + 14, Math.max(6, 16 * cam.scale));
              ctx.stroke();
              ctx.setLineDash([]);
            }
          }
        }

        function nodesInMarquee(box) {
          const left = Math.min(box.startX, box.x);
          const right = Math.max(box.startX, box.x);
          const top = Math.min(box.startY, box.y);
          const bottom = Math.max(box.startY, box.y);
          const ids = [];
          for (const node of doc.nodes) {
            if (isNodeHidden(node)) continue;
            const p = worldToScreen(node.x, node.y);
            const w = node.w * cam.scale;
            const h = node.h * cam.scale;
            if (p.x + w >= left && p.x <= right && p.y + h >= top && p.y <= bottom) {
              ids.push(node.id);
            }
          }
          return ids;
        }

        function drawMarquee() {
          if (!marquee) return;
          const x = Math.min(marquee.startX, marquee.x);
          const y = Math.min(marquee.startY, marquee.y);
          const w = Math.abs(marquee.x - marquee.startX);
          const h = Math.abs(marquee.y - marquee.startY);
          ctx.fillStyle = "rgba(77, 102, 112, 0.06)";
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = "rgba(77, 102, 112, 0.68)";
          ctx.lineWidth = 1.2;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);
        }

        // ---------- 相机 ----------

        function zoomAt(sx, sy, factor) {
          const before = screenToWorld(sx, sy);
          cam.scale = clampScale(cam.scale * factor);
          cam.x = sx - before.x * cam.scale;
          cam.y = sy - before.y * cam.scale;
          requestRender();
        }

        function fitView() {
          if (!doc.nodes.length && !doc.groups.length) {
            cam.scale = 1;
            cam.x = viewport.w / 2;
            cam.y = viewport.h / 2;
            requestRender();
            return;
          }
          let minX = Infinity;
          let minY = Infinity;
          let maxX = -Infinity;
          let maxY = -Infinity;
          for (const n of doc.nodes) {
            if (isNodeHidden(n)) continue;
            minX = Math.min(minX, n.x);
            minY = Math.min(minY, n.y);
            maxX = Math.max(maxX, n.x + n.w);
            maxY = Math.max(maxY, n.y + n.h);
          }
          const groupBounds = computeGroupBounds();
          for (const group of doc.groups) {
            if (isGroupHidden(group)) continue;
            const rect = group.collapsed
              ? groupBounds.chip(group.id)
              : groupBounds.expanded(group.id);
            if (!rect) continue;
            minX = Math.min(minX, rect.x);
            minY = Math.min(minY, rect.y);
            maxX = Math.max(maxX, rect.x + rect.w);
            maxY = Math.max(maxY, rect.y + rect.h);
          }
          const bw = Math.max(1, maxX - minX);
          const bh = Math.max(1, maxY - minY);
          const topInset = 120;
          const bottomInset = 150;
          const sideInset = 28;
          const availW = Math.max(80, viewport.w - sideInset * 2);
          const availH = Math.max(80, viewport.h - topInset - bottomInset);
          const scale = clampScale(Math.min(availW / bw, availH / bh, 1.6));
          cam.scale = scale;
          cam.x = viewport.w / 2 - ((minX + maxX) / 2) * scale;
          cam.y = topInset + availH / 2 - ((minY + maxY) / 2) * scale;
          requestRender();
        }

        // ---------- 历史 ----------

        function snapshotDoc() {
          return JSON.stringify({
            nodes: doc.nodes.map((n) => ({
              id: n.id,
              x: n.x,
              y: n.y,
              w: n.w,
              h: n.h,
              text: n.text,
              color: n.color,
              parentId: n.parentId || null,
            })),
            edges: doc.edges.map((e) => ({ id: e.id, from: e.from, to: e.to })),
            groups: doc.groups.map((group) => ({
              id: group.id,
              title: group.title,
              parentId: group.parentId || null,
              collapsed: !!group.collapsed,
            })),
          });
        }

        function resetHistory() {
          history.states = [snapshotDoc()];
          history.index = 0;
          updateUI();
        }

        function commitHistory() {
          const snap = snapshotDoc();
          if (history.states[history.index] === snap) {
            updateUI();
            return;
          }
          history.states = history.states.slice(0, history.index + 1);
          history.states.push(snap);
          if (history.states.length > 100) history.states.shift();
          history.index = history.states.length - 1;
          updateUI();
        }

        function applySnapshot(raw) {
          const data = JSON.parse(raw);
          doc.groups = (data.groups || []).map(normalizeGroup);
          doc.nodes = data.nodes.map(normalizeNode);
          doc.edges = data.edges.map(normalizeEdge).filter((e) => nodeById(e.from) && nodeById(e.to));
          sanitizeGroups();
          pruneEmptyGroups();
          for (const node of doc.nodes) layoutNode(node, true);
          selectedIds = new Set(
            [...selectedIds].filter((id) => nodeById(id) || groupById(id)),
          );
          if (connectFrom && !nodeById(connectFrom)) connectFrom = null;
          requestRender();
          updateUI();
        }

        function undo() {
          commitEditing();
          if (history.index <= 0) return;
          history.index -= 1;
          applySnapshot(history.states[history.index]);
          saveLater();
          showToast("已撤销");
        }

        function redo() {
          commitEditing();
          if (history.index >= history.states.length - 1) return;
          history.index += 1;
          applySnapshot(history.states[history.index]);
          saveLater();
          showToast("已重做");
        }

        // ---------- 存储 ----------

        function serializeDoc() {
          return {
            version: 1,
            nodes: doc.nodes.map((n) => ({
              id: n.id,
              x: n.x,
              y: n.y,
              w: n.w,
              h: n.h,
              text: n.text,
              color: n.color,
              parentId: n.parentId || null,
            })),
            edges: doc.edges.map((e) => ({ id: e.id, from: e.from, to: e.to })),
            groups: doc.groups.map((group) => ({
              id: group.id,
              title: group.title,
              parentId: group.parentId || null,
              collapsed: !!group.collapsed,
            })),
            camera: { x: cam.x, y: cam.y, scale: cam.scale },
          };
        }

        function warnStorage() {
          if (!storageWarned) {
            storageWarned = true;
            showToast("本地保存不可用，记得用“导出 JSON”备份");
          }
        }

        function currentCanvas() {
          return canvasIndex.find((item) => item.id === activeCanvasId) || null;
        }

        function saveIndex() {
          try {
            localStorage.setItem(
              STORAGE_INDEX_KEY,
              JSON.stringify({
                activeId: activeCanvasId,
                items: canvasIndex.map(({ id, name, updatedAt }) => ({ id, name, updatedAt })),
              }),
            );
          } catch (error) {
            warnStorage();
          }
        }

        function saveNow() {
          if (!activeCanvasId) return;
          try {
            localStorage.setItem(
              STORAGE_DOC_PREFIX + activeCanvasId,
              JSON.stringify(serializeDoc()),
            );
            const item = currentCanvas();
            if (item) item.updatedAt = Date.now();
            saveIndex();
          } catch (error) {
            warnStorage();
          }
        }

        function saveLater() {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(saveNow, 300);
        }

        function normalizeCanvasItem(raw, index) {
          return {
            id: typeof raw.id === "string" && raw.id ? raw.id : uid(),
            name:
              typeof raw.name === "string" && raw.name.trim()
                ? raw.name.trim()
                : "画布 " + (index + 1),
            updatedAt: Number.isFinite(raw.updatedAt) ? raw.updatedAt : Date.now(),
          };
        }

        function loadCanvasData(id) {
          if (!id) return null;
          try {
            const raw = localStorage.getItem(STORAGE_DOC_PREFIX + id);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) return null;
            return data;
          } catch (error) {
            return null;
          }
        }

        function applyCanvasData(data) {
          doc.groups = (data.groups || []).map(normalizeGroup);
          doc.nodes = data.nodes.map(normalizeNode);
          doc.edges = data.edges
            .map(normalizeEdge)
            .filter((e) => nodeById(e.from) && nodeById(e.to));
          sanitizeGroups();
          pruneEmptyGroups();
          for (const node of doc.nodes) layoutNode(node, true);
          if (
            data.camera &&
            Number.isFinite(data.camera.x) &&
            Number.isFinite(data.camera.y) &&
            Number.isFinite(data.camera.scale)
          ) {
            cam.x = data.camera.x;
            cam.y = data.camera.y;
            cam.scale = clampScale(data.camera.scale);
          } else {
            fitView();
          }
          selectedIds.clear();
          mode = "select";
          connectFrom = null;
          lastTap = null;
          requestRender();
          updateUI();
        }

        function updateCanvasLabel() {
          const item = currentCanvas();
          const name = item ? item.name : "画布";
          if (canvasNameEl) canvasNameEl.textContent = name;
          document.title = "画布 · " + name;
        }

        function nextCanvasName() {
          let max = 0;
          for (const item of canvasIndex) {
            const match = /^画布 (\d+)$/.exec(item.name);
            if (match) max = Math.max(max, Number(match[1]));
          }
          return "画布 " + (max + 1);
        }

        function createCanvas() {
          commitEditing();
          saveNow();
          const record = {
            id: uid(),
            name: nextCanvasName(),
            updatedAt: Date.now(),
          };
          canvasIndex.push(record);
          activeCanvasId = record.id;
          doc.nodes = [];
          doc.edges = [];
          doc.groups = [];
          selectedIds.clear();
          mode = "select";
          connectFrom = null;
          lastTap = null;
          cam.scale = 1;
          cam.x = viewport.w / 2;
          cam.y = viewport.h / 2;
          resetHistory();
          saveNow();
          updateUI();
          updateCanvasLabel();
          requestRender();
          closeMenu();
          showToast("已新建「" + record.name + "」");
        }

        function switchCanvas(id) {
          if (!id || id === activeCanvasId) return;
          commitEditing();
          saveNow();
          const data = loadCanvasData(id);
          if (!data) {
            showToast("这个画布的数据读不出来");
            return;
          }
          activeCanvasId = id;
          applyCanvasData(data);
          resetHistory();
          updateCanvasLabel();
          saveIndex();
          showToast("已切换画布");
        }

        function openCanvasMenu() {
          commitEditing();
          const rect = canvasBtn.getBoundingClientRect();
          const items = [{ type: "label", label: "切换画布" }];
          for (const item of canvasIndex) {
            items.push({
              label: item.name,
              active: item.id === activeCanvasId,
              action: () => switchCanvas(item.id),
            });
          }
          items.push({
            label: "保存当前画布",
            action: () => {
              commitEditing();
              saveNow();
              showToast("已保存");
            },
          });
          items.push({ label: "新建画布", action: createCanvas });
          openMenu(rect.left, rect.bottom + 6, items);
        }

        function clearAllStorage() {
          try {
            localStorage.removeItem(LEGACY_STORAGE_KEY);
            localStorage.removeItem(STORAGE_INDEX_KEY);
            for (let i = localStorage.length - 1; i >= 0; i--) {
              const key = localStorage.key(i);
              if (key && key.startsWith(STORAGE_DOC_PREFIX)) localStorage.removeItem(key);
            }
          } catch (error) {
            // 无存储环境忽略
          }
        }

        function initializeCanvases() {
          let loaded = false;
          try {
            const rawIndex = localStorage.getItem(STORAGE_INDEX_KEY);
            if (rawIndex) {
              const parsed = JSON.parse(rawIndex);
              if (parsed && Array.isArray(parsed.items) && parsed.items.length) {
                canvasIndex = parsed.items.map(normalizeCanvasItem);
                const ids = new Set(canvasIndex.map((item) => item.id));
                activeCanvasId = ids.has(parsed.activeId) ? parsed.activeId : canvasIndex[0].id;
                let data = loadCanvasData(activeCanvasId);
                if (!data) {
                  for (const item of canvasIndex) {
                    data = loadCanvasData(item.id);
                    if (data) {
                      activeCanvasId = item.id;
                      break;
                    }
                  }
                }
                if (data) {
                  applyCanvasData(data);
                  loaded = true;
                } else {
                  const record = { id: uid(), name: nextCanvasName(), updatedAt: Date.now() };
                  canvasIndex.push(record);
                  activeCanvasId = record.id;
                  doc.nodes = [];
                  doc.edges = [];
                  cam.scale = 1;
                  cam.x = viewport.w / 2;
                  cam.y = viewport.h / 2;
                  loaded = true;
                }
              }
            }
          } catch (error) {
            canvasIndex = [];
            activeCanvasId = null;
          }

          if (!loaded) {
            let legacy = null;
            try {
              const rawLegacy = localStorage.getItem(LEGACY_STORAGE_KEY);
              if (rawLegacy) legacy = JSON.parse(rawLegacy);
            } catch (error) {
              legacy = null;
            }
            const record = { id: uid(), name: "画布 1", updatedAt: Date.now() };
            canvasIndex = [record];
            activeCanvasId = record.id;
            if (legacy && Array.isArray(legacy.nodes) && Array.isArray(legacy.edges)) {
              applyCanvasData(legacy);
            } else {
              seedDemo();
            }
          }

          updateCanvasLabel();
          saveNow();
        }

        // ---------- 节点操作 ----------

        function createNodeAt(worldX, worldY, withEdit = true, parentId = null) {
          const node = {
            id: uid(),
            x: worldX - MIN_W / 2,
            y: worldY - MIN_H / 2,
            w: 200,
            h: MIN_H,
            text: "",
            color: NODE_COLORS[0],
            parentId: parentId || null,
            lines: [""],
          };
          layoutNode(node, false);
          node.x = worldX - node.w / 2;
          node.y = worldY - node.h / 2;
          doc.nodes.push(node);
          selectedIds = new Set([node.id]);
          lastTap = null;
          commitHistory();
          saveLater();
          requestRender();
          if (withEdit) startEditing(node, true);
          return node;
        }

        function pruneEmptyGroups() {
          let changed = true;
          while (changed) {
            changed = false;
            for (let i = doc.groups.length - 1; i >= 0; i--) {
              const group = doc.groups[i];
              const hasNodes = doc.nodes.some((node) => node.parentId === group.id);
              const hasGroups = doc.groups.some(
                (child) => child.parentId === group.id && child.id !== group.id,
              );
              if (!hasNodes && !hasGroups) {
                doc.groups.splice(i, 1);
                selectedIds.delete(group.id);
                changed = true;
              }
            }
          }
        }

        function ungroupGroup(groupId, commit) {
          const group = groupById(groupId);
          if (!group) return;
          const parentId = group.parentId || null;
          for (const node of doc.nodes) {
            if (node.parentId === groupId) node.parentId = parentId;
          }
          for (const child of doc.groups) {
            if (child.parentId === groupId) child.parentId = parentId;
          }
          doc.groups = doc.groups.filter((item) => item.id !== groupId);
          selectedIds.delete(groupId);
          if (commit) {
            pruneEmptyGroups();
            commitHistory();
            saveLater();
          }
        }

        function removeNode(id, commit) {
          doc.nodes = doc.nodes.filter((n) => n.id !== id);
          doc.edges = doc.edges.filter((e) => e.from !== id && e.to !== id);
          selectedIds.delete(id);
          if (connectFrom === id) connectFrom = null;
          pruneEmptyGroups();
          if (commit) {
            commitHistory();
            saveLater();
          }
          requestRender();
          updateUI();
        }

        function deleteSelected() {
          if (!selectedIds.size) return;
          const nodeIds = selectedNodeList().map((node) => node.id);
          const groupIds = selectedGroupList().map((group) => group.id);
          for (const id of nodeIds) removeNode(id, false);
          for (const id of groupIds) ungroupGroup(id, false);
          pruneEmptyGroups();
          if (nodeIds.length || groupIds.length) {
            commitHistory();
            saveLater();
            showToast("已删除");
          }
          updateUI();
          requestRender();
        }

        function finishNodeDrag(reparent = false) {
          if (reparent && draggingOrigins.size) {
            const bounds = computeGroupBounds();
            for (const [nodeId, origin] of draggingOrigins) {
              const node = nodeById(nodeId);
              if (!node) continue;
              const cx = node.x + node.w / 2;
              const cy = node.y + node.h / 2;
              let target = groupAtWorld(cx, cy, bounds, true);
              if (!target && origin.parentId && origin.parentBounds) {
                const box = origin.parentBounds;
                if (
                  cx >= box.x &&
                  cx <= box.x + box.w &&
                  cy >= box.y &&
                  cy <= box.y + box.h
                ) {
                  target = groupById(origin.parentId);
                }
              }
              node.parentId = target ? target.id : null;
            }
            pruneEmptyGroups();
          }
          draggingNodeIds = new Set();
          draggingOrigins = new Map();
        }

        function removeEdge(edge) {
          doc.edges = doc.edges.filter((e) => e.id !== edge.id);
          commitHistory();
          saveLater();
          requestRender();
          updateUI();
          showToast("已删除连线");
        }

        function setNodeColor(node, color) {
          if (node.color === color) return;
          node.color = color;
          commitHistory();
          saveLater();
          requestRender();
        }

        // ---------- 编辑 ----------

        function ensureEditableZoom(node) {
          const min = 0.85;
          const max = 2.5;
          const center = { x: node.x + node.w / 2, y: node.y + node.h / 2 };
          const screen = worldToScreen(center.x, center.y);
          if (cam.scale < min) {
            zoomAt(screen.x, screen.y, min / cam.scale);
          } else if (cam.scale > max) {
            zoomAt(screen.x, screen.y, max / cam.scale);
          }
        }

        function startEditing(node, isNew) {
          if (editing) commitEditing();
          ensureEditableZoom(node);
          layoutNode(node, false);
          editing = {
            node,
            isNew,
            beforeText: node.text,
            beforeW: node.w,
            beforeH: node.h,
          };
          selectedIds = new Set([node.id]);
          lastTap = null;
          editor.value = node.text;
          editor.classList.add("show");
          doneBtn.classList.add("show");
          positionEditor();
          requestRender();
          editor.focus({ preventScroll: true });
          const end = editor.value.length;
          try {
            editor.setSelectionRange(end, end);
          } catch (error) {
            // 某些 WebView 不支持 setSelectionRange
          }
          setTimeout(() => {
            if (!editing) return;
            positionEditor();
            ensureNodeVisible(editing.node);
          }, 280);
          updateUI();
        }

        function positionEditor() {
          if (!editing) return;
          const node = editing.node;
          const p = worldToScreen(node.x, node.y);
          const k = cam.scale;
          editor.style.left = p.x + "px";
          editor.style.top = p.y + "px";
          editor.style.width = Math.max(60, node.w * k) + "px";
          editor.style.height = Math.max(44, node.h * k) + "px";
          editor.style.fontSize = FONT_SIZE * k + "px";
          editor.style.lineHeight = LINE_HEIGHT * k + "px";
          editor.style.padding = PAD_Y * k + "px " + PAD_X * k + "px";
          editor.style.borderRadius = Math.max(6, 10 * k) + "px";
          editor.style.background = node.color;
        }

        function ensureNodeVisible(node) {
          if (!node) return;
          const vh = (window.visualViewport && window.visualViewport.height) || viewport.h;
          const p = worldToScreen(node.x, node.y);
          const bottom = p.y + node.h * cam.scale;
          const limit = vh - 120;
          if (bottom > limit) {
            cam.y -= bottom - limit;
            positionEditor();
            requestRender();
          } else if (p.y < 70) {
            cam.y += 70 - p.y;
            positionEditor();
            requestRender();
          }
        }

        function commitEditing() {
          if (!editing) return;
          const { node, isNew, beforeText, beforeW, beforeH } = editing;
          const text = editor.value;
          const centerX = node.x + beforeW / 2;
          const centerY = node.y + beforeH / 2;
          editing = null;
          editor.classList.remove("show");
          doneBtn.classList.remove("show");
          editor.blur();

          node.text = text;
          const empty = text.trim() === "";
          if (empty) {
            removeNode(node.id, false);
            if (isNew) {
              if (history.states.length > 1) {
                history.states.pop();
                history.index = Math.max(0, history.index - 1);
              }
            } else {
              commitHistory();
            }
            selectedIds.delete(node.id);
            saveLater();
          } else {
            layoutNode(node, true);
            if (isNew) {
              node.x = centerX - node.w / 2;
              node.y = centerY - node.h / 2;
              if (history.states.length) history.states[history.index] = snapshotDoc();
            } else if (text !== beforeText || node.w !== beforeW) {
              commitHistory();
            }
            saveLater();
          }
          updateUI();
          requestRender();
        }

        // ---------- 菜单与提示 ----------

        function openMenu(x, y, items, options) {
          const opts = options || {};
          menuEl.innerHTML = "";
          for (const item of items) {
            if (item.type === "label") {
              const label = document.createElement("div");
              label.className = "menu-label";
              label.textContent = item.label;
              menuEl.appendChild(label);
              continue;
            }
            if (item.type === "swatches") {
              const row = document.createElement("div");
              row.className = "swatches";
              for (const color of NODE_COLORS) {
                const swatch = document.createElement("button");
                swatch.type = "button";
                swatch.className = "swatch" + (item.current === color ? " active" : "");
                swatch.style.background = color;
                swatch.setAttribute("aria-label", "节点颜色 " + color);
                swatch.addEventListener("click", () => {
                  closeMenu();
                  item.action(color);
                });
                row.appendChild(swatch);
              }
              menuEl.appendChild(row);
              continue;
            }
            const button = document.createElement("button");
            button.type = "button";
            button.className = "menu-item" + (item.danger ? " danger" : "");
            button.textContent = item.label;
            button.addEventListener("click", () => {
              closeMenu();
              item.action();
            });
            menuEl.appendChild(button);
          }
          menuEl.hidden = false;
          menuEl.style.left = "0px";
          menuEl.style.top = "0px";
          const rect = menuEl.getBoundingClientRect();
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const left = clamp(x, 8, Math.max(8, vw - rect.width - 8));
          const top = clamp(opts.above ? y - rect.height - 8 : y, 8, Math.max(8, vh - rect.height - 8));
          menuEl.style.left = left + "px";
          menuEl.style.top = top + "px";
        }

        function closeMenu() {
          menuEl.hidden = true;
        }

        function openNodeMenu(node, x, y) {
          const items = [
            { label: "编辑文字", action: () => startEditing(node, false) },
            {
              label: connectFrom === node.id ? "取消连线起点" : "从这里开始连线",
              action: () => {
                mode = "connect";
                connectFrom = node.id;
                selectedIds = new Set([node.id]);
                updateUI();
                requestRender();
                showToast("再点一个节点完成连线");
              },
            },
            { type: "label", label: "节点颜色" },
            { type: "swatches", current: node.color, action: (color) => setNodeColor(node, color) },
          ];
          if (node.parentId) {
            items.push({
              label: "选择所在分组",
              action: () => {
                const group = groupById(node.parentId);
                if (group) selectOnly(group.id);
              },
            });
            items.push({
              label: "移出分组",
              action: () => {
                node.parentId = null;
                pruneEmptyGroups();
                commitHistory();
                saveNow();
                updateUI();
                requestRender();
                showToast("已移出分组");
              },
            });
          }
          items.push({
            label: "删除节点",
            danger: true,
            action: () => removeNode(node.id, true),
          });
          openMenu(x, y, items);
        }

        function openEmptyMenu(x, y) {
          const world = screenToWorld(x, y);
          const group = deepestGroupAt(x, y, false);
          openMenu(x, y, [
            {
              label: "在此新建文本节点",
              action: () => createNodeAt(world.x, world.y, true, group ? group.id : null),
            },
            { label: "适应画布", action: fitView },
          ]);
        }

        function nextGroupTitle() {
          let max = 0;
          for (const group of doc.groups) {
            const match = /^分组 (\d+)$/.exec(group.title);
            if (match) max = Math.max(max, Number(match[1]));
          }
          return "分组 " + (max + 1);
        }

        function groupSelectedNodes() {
          commitEditing();
          const nodes = selectedNodeList();
          if (!nodes.length) return;
          const parentId = commonParentForNodes(nodes);
          const group = {
            id: uid(),
            title: nextGroupTitle(),
            parentId,
            collapsed: false,
          };
          doc.groups.push(group);
          for (const node of nodes) node.parentId = group.id;
          pruneEmptyGroups();
          selectedIds = new Set([group.id]);
          commitHistory();
          saveNow();
          updateUI();
          requestRender();
          showToast("已新建「" + group.title + "」");
        }

        function toggleGroupCollapse(group) {
          group.collapsed = !group.collapsed;
          commitHistory();
          saveNow();
          updateUI();
          requestRender();
          showToast(group.collapsed ? "已折叠分组" : "已展开分组");
        }

        function removeGroupDeep(groupId) {
          const groupIds = new Set([groupId]);
          const addChildren = (id) => {
            for (const child of directChildGroups(id)) {
              groupIds.add(child.id);
              addChildren(child.id);
            }
          };
          addChildren(groupId);
          const nodeIds = new Set();
          for (const id of groupIds) {
            for (const node of directChildNodes(id)) nodeIds.add(node.id);
          }
          doc.nodes = doc.nodes.filter((node) => !nodeIds.has(node.id));
          doc.edges = doc.edges.filter(
            (edge) => !nodeIds.has(edge.from) && !nodeIds.has(edge.to),
          );
          doc.groups = doc.groups.filter((group) => !groupIds.has(group.id));
          for (const id of groupIds) selectedIds.delete(id);
          for (const id of nodeIds) selectedIds.delete(id);
          pruneEmptyGroups();
          commitHistory();
          saveNow();
          updateUI();
          requestRender();
          showToast("已删除分组");
        }

        function openGroupMenu(group, x, y) {
          selectedIds = new Set([group.id]);
          updateUI();
          requestRender();
          const items = [
            {
              label: group.collapsed ? "展开分组" : "折叠分组",
              action: () => toggleGroupCollapse(group),
            },
          ];
          if (group.parentId) {
            items.push({
              label: "选择上层分组",
              action: () => selectOnly(group.parentId),
            });
            items.push({
              label: "移到顶层",
              action: () => {
                group.parentId = null;
                pruneEmptyGroups();
                commitHistory();
                saveNow();
                updateUI();
                requestRender();
                showToast("已移到顶层");
              },
            });
          }
          items.push({
            label: "解散分组（保留内容）",
            action: () => {
              ungroupGroup(group.id, true);
              showToast("已解散分组");
            },
          });
          items.push({
            label: "删除分组及内容",
            danger: true,
            action: () => {
              if (!window.confirm("删除分组及其中所有内容？这一步可以撤销。")) return;
              removeGroupDeep(group.id);
            },
          });
          openMenu(x, y, items);
        }

        function openEdgeMenu(edge, x, y) {
          openMenu(x, y, [{ label: "删除这条连线", danger: true, action: () => removeEdge(edge) }]);
        }

        function showToast(message) {
          toastEl.textContent = message;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
        }

        function updateHint() {
          hintText.textContent =
            mode === "connect"
              ? connectFrom
                ? "再点一个节点完成连线"
                : "点选一个节点作为连线起点"
              : "双击空白新建 · 长按拖动框选 · 双指缩放";
        }

        function updateUI() {
          undoBtn.disabled = history.index <= 0;
          redoBtn.disabled = history.index >= history.states.length - 1;
          deleteBtn.disabled = selectedIds.size === 0;
          groupBtn.disabled = selectedNodeList().length === 0;
          connectBtn.classList.toggle("active", mode === "connect");
          document.body.classList.toggle("connecting", mode === "connect");
          emptyEl.hidden = doc.nodes.length > 0 || doc.groups.length > 0;
          updateHint();
          updateCanvasLabel();
        }

        // ---------- 交互 ----------

        function cancelLongPress() {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }

        function scheduleLongPress(point) {
          cancelLongPress();
          longPressTimer = setTimeout(() => {
            longPressTimer = null;
            if (!gesture || gesture.moved || gesture.suppress || pointers.size !== 1) return;
            gesture.suppress = true;
            longPressed = true;
            if (gesture.type === "group-drag" && gesture.group) {
              selectedIds = new Set([gesture.group.id]);
              updateUI();
              requestRender();
              openGroupMenu(gesture.group, point.x, point.y);
            } else if (gesture.type === "drag" && gesture.node) {
              selectedIds = new Set([gesture.node.id]);
              updateUI();
              requestRender();
              openNodeMenu(gesture.node, point.x, point.y);
            } else {
              const edge = hitEdge(point.x, point.y);
              if (edge) {
                openEdgeMenu(edge, point.x, point.y);
              } else {
                marquee = {
                  startX: point.x,
                  startY: point.y,
                  x: point.x,
                  y: point.y,
                };
                requestRender();
              }
            }
          }, 500);
        }

        function hitNode(sx, sy) {
          const p = screenToWorld(sx, sy);
          for (let i = doc.nodes.length - 1; i >= 0; i--) {
            const n = doc.nodes[i];
            if (isNodeHidden(n)) continue;
            if (p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h) return n;
          }
          return null;
        }

        function hitGroupTitle(sx, sy) {
          const bounds = computeGroupBounds();
          const groups = doc.groups.slice().sort((a, b) => groupDepth(b) - groupDepth(a));
          for (const group of groups) {
            if (isGroupHidden(group)) continue;
            const rect = group.collapsed
              ? bounds.chip(group.id)
              : (() => {
                  const expanded = bounds.expanded(group.id);
                  return expanded
                    ? {
                        x: expanded.x,
                        y: expanded.y,
                        w: expanded.w,
                        h: GROUP_TITLE_HEIGHT,
                      }
                    : null;
                })();
            if (!rect) continue;
            const p = worldToScreen(rect.x, rect.y);
            const w = rect.w * cam.scale;
            const h = Math.max(rect.h * cam.scale, 16);
            if (sx >= p.x && sx <= p.x + w && sy >= p.y && sy <= p.y + h) return group;
          }
          return null;
        }

        function deepestGroupAt(sx, sy, includeCollapsed = true) {
          const bounds = computeGroupBounds();
          const p = screenToWorld(sx, sy);
          return groupAtWorld(p.x, p.y, bounds, !includeCollapsed);
        }

        function groupAtWorld(x, y, bounds, skipCollapsed = true) {
          const groups = doc.groups.slice().sort((a, b) => groupDepth(b) - groupDepth(a));
          for (const group of groups) {
            if (isGroupHidden(group)) continue;
            if (group.collapsed && skipCollapsed) continue;
            const rect = group.collapsed ? bounds.chip(group.id) : bounds.expanded(group.id);
            if (!rect) continue;
            if (
              x >= rect.x &&
              x <= rect.x + rect.w &&
              y >= rect.y &&
              y <= rect.y + rect.h
            ) {
              return group;
            }
          }
          return null;
        }

        function startPinch() {
          const pts = [...pointers.values()].slice(0, 2);
          if (pts.length < 2) {
            pinch = null;
            return;
          }
          pinch = {
            mid: { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 },
            dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
          };
        }

        function doPinch() {
          const pts = [...pointers.values()].slice(0, 2);
          if (pts.length < 2) return;
          const mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (!pinch || pinch.dist < 1) {
            pinch = { mid, dist };
            return;
          }
          const factor = clamp(dist / pinch.dist, 0.5, 2);
          zoomAt(mid.x, mid.y, factor);
          cam.x += mid.x - pinch.mid.x;
          cam.y += mid.y - pinch.mid.y;
          pinch = { mid, dist };
          requestRender();
        }

        function onPointerDown(event) {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          event.preventDefault();

          if (editing) {
            commitEditing();
            return;
          }
          if (!menuEl.hidden) closeMenu();

          try {
            canvas.setPointerCapture(event.pointerId);
          } catch (error) {
            // 部分浏览器不支持捕获
          }

          const point = { x: event.clientX, y: event.clientY };
          pointers.set(event.pointerId, point);

          if (pointers.size === 1) {
            suppressTap = false;
            longPressed = false;
            const node = hitNode(point.x, point.y);
            const groupTitle = node ? null : hitGroupTitle(point.x, point.y);
