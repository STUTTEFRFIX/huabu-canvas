            if (node) {
              if (!selectedIds.has(node.id)) {
                selectedIds = new Set([node.id]);
              }
              let dragNodes = selectedNodeList();
              if (!dragNodes.length) dragNodes = [node];
              draggingNodeIds = new Set();
              const boundsBefore = computeGroupBounds();
              draggingNodeIds = new Set(dragNodes.map((item) => item.id));
              draggingOrigins = new Map(
                dragNodes.map((item) => [
                  item.id,
                  {
                    parentId: item.parentId || null,
                    parentBounds: item.parentId
                      ? boundsBefore.expanded(item.parentId)
                      : null,
                  },
                ]),
              );
              updateUI();
              gesture = {
                type: "drag",
                pointerId: event.pointerId,
                node,
                nodes: dragNodes.map((item) => ({
                  node: item,
                  x0: item.x,
                  y0: item.y,
                })),
                startWorld: screenToWorld(point.x, point.y),
                startX: point.x,
                startY: point.y,
                lastX: point.x,
                lastY: point.y,
                moved: false,
                suppress: false,
              };
            } else if (groupTitle) {
              selectedIds = new Set([groupTitle.id]);
              updateUI();
              draggingNodeIds = new Set();
              draggingOrigins = new Map();
              const groupNodes = descendantNodes(groupTitle.id);
              gesture = {
                type: "group-drag",
                pointerId: event.pointerId,
                groupId: groupTitle.id,
                group: groupTitle,
                nodes: groupNodes.map((item) => ({
                  node: item,
                  x0: item.x,
                  y0: item.y,
                })),
                startWorld: screenToWorld(point.x, point.y),
                startX: point.x,
                startY: point.y,
                lastX: point.x,
                lastY: point.y,
                moved: false,
                suppress: false,
              };
            } else {
              draggingNodeIds = new Set();
              draggingOrigins = new Map();
              gesture = {
                type: "pan",
                pointerId: event.pointerId,
                startX: point.x,
                startY: point.y,
                lastX: point.x,
                lastY: point.y,
                moved: false,
                suppress: false,
              };
            }
            scheduleLongPress(point);
          } else if (pointers.size === 2) {
            cancelLongPress();
            marquee = null;
            if (gesture && gesture.type === "drag" && gesture.moved) {
              finishNodeDrag(true);
              commitHistory();
              saveLater();
            } else if (gesture && gesture.type === "drag") {
              finishNodeDrag(false);
            } else if (gesture && gesture.type === "group-drag" && gesture.moved) {
              commitHistory();
              saveLater();
            }
            gesture = null;
            suppressTap = true;
            startPinch();
          } else {
            cancelLongPress();
          }
          requestRender();
        }

        function onPointerMove(event) {
          if (!pointers.has(event.pointerId)) return;
          event.preventDefault();
          const point = { x: event.clientX, y: event.clientY };
          pointers.set(event.pointerId, point);

          if (pointers.size >= 2) {
            doPinch();
            return;
          }
          if (marquee) {
            marquee.x = point.x;
            marquee.y = point.y;
            requestRender();
            return;
          }
          if (!gesture || gesture.suppress) return;

          const dx = point.x - gesture.lastX;
          const dy = point.y - gesture.lastY;
          if (Math.hypot(point.x - gesture.startX, point.y - gesture.startY) > 4) {
            if (!gesture.moved) {
              gesture.moved = true;
              cancelLongPress();
            }
          }
          if (gesture.type === "drag" || gesture.type === "group-drag") {
            const world = screenToWorld(point.x, point.y);
            const moveX = world.x - gesture.startWorld.x;
            const moveY = world.y - gesture.startWorld.y;
            for (const item of gesture.nodes) {
              item.node.x = item.x0 + moveX;
              item.node.y = item.y0 + moveY;
            }
          } else {
            cam.x += dx;
            cam.y += dy;
          }
          gesture.lastX = point.x;
          gesture.lastY = point.y;
          requestRender();
        }

        function onTapNode(node, point) {
          if (mode === "connect") {
            handleConnectTap(node);
            return;
          }
          const now = performance.now();
          const isDouble =
            lastTap &&
            lastTap.nodeId === node.id &&
            now - lastTap.time < 320 &&
            Math.hypot(point.x - lastTap.x, point.y - lastTap.y) < 26;
          if (isDouble) {
            lastTap = null;
            startEditing(node, false);
            return;
          }
          selectedIds = new Set([node.id]);
          lastTap = { nodeId: node.id, x: point.x, y: point.y, time: now };
          updateUI();
          requestRender();
        }

        function onTapEmpty(point) {
          if (mode === "connect") {
            mode = "select";
            connectFrom = null;
            updateUI();
            requestRender();
            showToast("已取消连线");
            return;
          }
          const now = performance.now();
          const isDouble =
            lastTap &&
            lastTap.nodeId === null &&
            now - lastTap.time < 320 &&
            Math.hypot(point.x - lastTap.x, point.y - lastTap.y) < 30;
          if (isDouble) {
            lastTap = null;
            const world = screenToWorld(point.x, point.y);
            const createGroup = deepestGroupAt(point.x, point.y, false);
            createNodeAt(world.x, world.y, true, createGroup ? createGroup.id : null);
            return;
          }
          const group = deepestGroupAt(point.x, point.y);
          if (group) {
            selectedIds = new Set([group.id]);
          } else {
            selectedIds.clear();
          }
          lastTap = { nodeId: null, x: point.x, y: point.y, time: now };
          updateUI();
          requestRender();
        }

        function handleConnectTap(node) {
          if (!connectFrom) {
            connectFrom = node.id;
            selectedIds = new Set([node.id]);
            updateUI();
            requestRender();
            showToast("再点一个节点完成连线");
            return;
          }
          if (connectFrom === node.id) {
            connectFrom = null;
            updateUI();
            requestRender();
            showToast("已取消起点");
            return;
          }
          const exists = doc.edges.some(
            (e) =>
              (e.from === connectFrom && e.to === node.id) || (e.from === node.id && e.to === connectFrom),
          );
          if (exists) {
            showToast("这两个节点已经连过了");
          } else {
            doc.edges.push({ id: uid(), from: connectFrom, to: node.id });
            commitHistory();
            saveLater();
            showToast("已连接");
          }
          connectFrom = null;
          updateUI();
          requestRender();
        }

        function onPointerUp(event) {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          const point = { x: event.clientX, y: event.clientY };
          const had = pointers.has(event.pointerId);
          pointers.delete(event.pointerId);
          if (!had) return;
          cancelLongPress();

          if (pointers.size >= 2) {
            startPinch();
            return;
          }
          if (pointers.size === 1) {
            pinch = null;
            suppressTap = true;
            gesture = null;
            return;
          }

          const wasSuppressed = suppressTap;
          suppressTap = false;
          pinch = null;

          if (marquee) {
            const moved =
              Math.hypot(marquee.x - marquee.startX, marquee.y - marquee.startY) > 6;
            if (moved) {
              const ids = nodesInMarquee(marquee);
              selectedIds = new Set(ids);
              if (ids.length) showToast("已选中 " + ids.length + " 个节点");
            } else {
              openEmptyMenu(point.x, point.y);
            }
            marquee = null;
            longPressed = false;
            gesture = null;
            updateUI();
            requestRender();
            return;
          }

          if (gesture && !gesture.suppress && !longPressed && !wasSuppressed) {
            if (gesture.type === "drag") {
              if (gesture.moved) {
                finishNodeDrag(true);
                commitHistory();
                saveLater();
              } else {
                finishNodeDrag(false);
                onTapNode(gesture.node, point);
              }
            } else if (gesture.type === "group-drag") {
              if (gesture.moved) {
                commitHistory();
                saveLater();
              }
            } else if (gesture.type === "pan" && !gesture.moved) {
              onTapEmpty(point);
            }
          } else if (gesture && gesture.type === "drag" && gesture.moved) {
            finishNodeDrag(true);
            commitHistory();
            saveLater();
          } else if (gesture && gesture.type === "drag") {
            finishNodeDrag(false);
          } else if (gesture && gesture.type === "group-drag" && gesture.moved) {
            commitHistory();
            saveLater();
          }

          longPressed = false;
          gesture = null;
          updateUI();
          requestRender();
        }

        function onPointerCancel(event) {
          pointers.delete(event.pointerId);
          cancelLongPress();
          if (gesture && gesture.type === "drag" && gesture.moved) {
            finishNodeDrag(true);
            commitHistory();
            saveLater();
          } else if (gesture && gesture.type === "drag") {
            finishNodeDrag(false);
          } else if (gesture && gesture.type === "group-drag" && gesture.moved) {
            commitHistory();
            saveLater();
          }
          marquee = null;
          gesture = null;
          pinch = null;
          suppressTap = true;
          updateUI();
          requestRender();
        }

        function onWheel(event) {
          event.preventDefault();
          if (editing) return;
          const factor = Math.exp(-event.deltaY * 0.0015);
          zoomAt(event.clientX, event.clientY, factor);
        }

        function onKeyDown(event) {
          if (editing) {
            if (event.key === "Escape") {
              event.preventDefault();
              commitEditing();
            }
            return;
          }
          const mod = event.ctrlKey || event.metaKey;
          if (mod && event.key.toLowerCase() === "z") {
            event.preventDefault();
            if (event.shiftKey) redo();
            else undo();
            return;
          }
          if (event.key === "Delete" || event.key === "Backspace") {
            if (selectedIds.size) {
              event.preventDefault();
              deleteSelected();
            }
            return;
          }
          if (event.key === "Escape") {
            closeMenu();
            if (mode === "connect") {
              mode = "select";
              connectFrom = null;
              updateUI();
              requestRender();
            }
            return;
          }
          if (event.key === "f" || event.key === "F") {
            fitView();
            return;
          }
          const enterNodes = selectedNodeList();
          if (event.key === "Enter" && enterNodes.length === 1) {
            event.preventDefault();
            startEditing(enterNodes[0], false);
          }
        }

        // ---------- 工具栏 ----------

        function toggleConnectMode() {
          commitEditing();
          if (mode === "connect") {
            mode = "select";
            connectFrom = null;
            showToast("已退出连线模式");
          } else {
            mode = "connect";
            connectFrom = null;
            showToast("点选起点和终点");
          }
          updateUI();
          requestRender();
        }

        function exportJSON() {
          const data = JSON.stringify(serializeDoc(), null, 2);
          const filename = "huabu-" + new Date().toISOString().slice(0, 10) + ".json";
          if (window.HuabuAndroid && typeof window.HuabuAndroid.saveText === "function") {
            try {
              window.HuabuAndroid.saveText(filename, data);
              showToast("已保存到下载目录");
              return;
            } catch (error) {
              // Android 桥接不可用时回退到浏览器下载
            }
          }
          const blob = new Blob([data], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast("已导出 JSON");
        }

        async function copyJSON() {
          const data = JSON.stringify(serializeDoc(), null, 2);
          if (window.HuabuAndroid && typeof window.HuabuAndroid.copyText === "function") {
            try {
              window.HuabuAndroid.copyText(data);
              showToast("JSON 已复制");
              return;
            } catch (error) {
              // Android 桥接不可用时回退到浏览器剪贴板
            }
          }
          try {
            await navigator.clipboard.writeText(data);
            showToast("JSON 已复制");
          } catch (error) {
            showToast("复制失败，请用“导出 JSON”");
          }
        }

        function clearDoc() {
          if (!doc.nodes.length && !doc.edges.length && !doc.groups.length) return;
          if (!window.confirm("清空画布？这一步可以撤销。")) return;
          doc.nodes = [];
          doc.edges = [];
          doc.groups = [];
          selectedIds.clear();
          mode = "select";
          connectFrom = null;
          commitHistory();
          saveLater();
          updateUI();
          fitView();
          showToast("已清空");
        }

        // ---------- 初始化 ----------

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
          viewport.w = w;
          viewport.h = h;
          viewport.dpr = dpr;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          requestRender();
        }

        function seedDemo() {
          const a = normalizeNode({ x: -100, y: -40, text: "在纸上，慢慢想" });
          const b = normalizeNode({ x: -180, y: -260, text: "双击空白\n写下第一个想法" });
          const c = normalizeNode({ x: -20, y: 190, text: "单指拖动\n双指缩放" });
          a.color = NODE_COLORS[0];
          b.color = NODE_COLORS[1];
          c.color = NODE_COLORS[2];
          doc.nodes.push(a, b, c);
          doc.edges.push({ id: uid(), from: a.id, to: b.id });
          doc.edges.push({ id: uid(), from: a.id, to: c.id });
          for (const node of doc.nodes) layoutNode(node, true);
          fitView();
          saveNow();
        }

        function bindEvents() {
          canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
          canvas.addEventListener("pointermove", onPointerMove, { passive: false });
          canvas.addEventListener("pointerup", onPointerUp, { passive: false });
          canvas.addEventListener("pointercancel", onPointerCancel, { passive: false });
          canvas.addEventListener("wheel", onWheel, { passive: false });
          canvas.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            if (editing) commitEditing();
            const node = hitNode(event.clientX, event.clientY);
            if (node) {
              selectedIds = new Set([node.id]);
              updateUI();
              requestRender();
              openNodeMenu(node, event.clientX, event.clientY);
            } else {
              const edge = hitEdge(event.clientX, event.clientY);
              if (edge) openEdgeMenu(edge, event.clientX, event.clientY);
              else openEmptyMenu(event.clientX, event.clientY);
            }
          });
          window.addEventListener("keydown", onKeyDown);
          window.addEventListener("resize", () => {
            resize();
            if (editing) setTimeout(() => positionEditor(), 60);
          });
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", () => {
              if (!editing) return;
              setTimeout(() => {
                if (!editing) return;
                positionEditor();
                ensureNodeVisible(editing.node);
              }, 60);
            });
          }
          window.addEventListener("pagehide", saveNow);

          document.addEventListener(
            "pointerdown",
            (event) => {
              if (menuEl.hidden) return;
              if (!menuEl.contains(event.target)) closeMenu();
            },
            true,
          );

          canvasBtn.addEventListener("click", openCanvasMenu);
          groupBtn.addEventListener("click", groupSelectedNodes);
          addBtn.addEventListener("click", () => {
            commitEditing();
            const sx = viewport.w / 2;
            const sy = viewport.h / 2 - 40;
            const center = screenToWorld(sx, sy);
            const group = deepestGroupAt(sx, sy, false);
            createNodeAt(center.x, center.y, true, group ? group.id : null);
          });
          connectBtn.addEventListener("click", toggleConnectMode);
          deleteBtn.addEventListener("click", () => {
            commitEditing();
            deleteSelected();
          });
          undoBtn.addEventListener("click", undo);
          redoBtn.addEventListener("click", redo);
          moreBtn.addEventListener("click", () => {
            commitEditing();
            const rect = moreBtn.getBoundingClientRect();
            openMenu(
              rect.left,
              rect.top,
              [
                { label: "适应画布", action: fitView },
                { label: "导出 JSON", action: exportJSON },
                { label: "复制 JSON", action: copyJSON },
                { label: "导入 JSON", action: () => fileInput.click() },
                { label: "清空画布", danger: true, action: clearDoc },
              ],
              { above: true },
            );
          });

          editor.addEventListener("input", () => {
            if (!editing) return;
            editing.node.text = editor.value;
            layoutNode(editing.node, false);
            positionEditor();
            ensureNodeVisible(editing.node);
            saveLater();
            requestRender();
          });
          editor.addEventListener("blur", () => {
            if (editing) commitEditing();
          });
          editor.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              event.preventDefault();
              commitEditing();
            }
          });
          doneBtn.addEventListener("pointerdown", (event) => event.preventDefault());
          doneBtn.addEventListener("click", commitEditing);

          document.getElementById("hint-close").addEventListener("click", () => {
            hintEl.classList.add("hidden");
          });

          fileInput.addEventListener("change", async () => {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = "";
            if (!file) return;
            try {
              const data = JSON.parse(await file.text());
              if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) {
                throw new Error("bad format");
              }
              doc.groups = (data.groups || []).map(normalizeGroup);
              doc.nodes = data.nodes.map(normalizeNode);
              doc.edges = data.edges
                .map(normalizeEdge)
                .filter((e) => nodeById(e.from) && nodeById(e.to));
              sanitizeGroups();
              pruneEmptyGroups();
              for (const node of doc.nodes) layoutNode(node, true);
              selectedIds.clear();
              mode = "select";
              connectFrom = null;
              resetHistory();
              saveNow();
              fitView();
              updateUI();
              showToast("已导入");
            } catch (error) {
              showToast("导入失败：不是有效的画布 JSON");
            }
          });
        }

        // 访问 ?selftest=1 时执行，覆盖新建、编辑、撤销、拖动、连线、删除、平移、缩放和本地保存。
        async function runSelfTest() {
          const results = [];
          const check = (name, condition) => results.push({ name, pass: !!condition });
          const tapAt = (x, y, pointerId) => {
            const init = {
              pointerId: pointerId || 91,
              clientX: x,
              clientY: y,
              button: 0,
              buttons: 1,
              pointerType: "mouse",
              bubbles: true,
              cancelable: true,
            };
            canvas.dispatchEvent(new PointerEvent("pointerdown", init));
            canvas.dispatchEvent(new PointerEvent("pointerup", { ...init, buttons: 0 }));
          };

          const initialCount = doc.nodes.length;
          check("初始画布尺寸", canvas.width > 0 && canvas.height > 0);

          tapAt(100, 620, 101);
          tapAt(100, 620, 102);
          check("双击空白进入编辑", !!editing && editor.classList.contains("show"));

          if (editing) {
            editor.value = "自测节点";
            editor.dispatchEvent(new Event("input", { bubbles: true }));
          }
          commitEditing();
          const created = doc.nodes[doc.nodes.length - 1];
          check(
            "新建并写入文字",
            doc.nodes.length === initialCount + 1 && created && created.text === "自测节点",
          );

          const afterCreate = doc.nodes.length;
          undo();
          check("撤销新建", doc.nodes.length === afterCreate - 1);
          redo();
          check("重做新建", doc.nodes.length === afterCreate);

          const dragNode = doc.nodes[0];
          const startX = dragNode.x;
          const startPoint = worldToScreen(dragNode.x + dragNode.w / 2, dragNode.y + dragNode.h / 2);
          canvas.dispatchEvent(
            new PointerEvent("pointerdown", {
              pointerId: 111,
              clientX: startPoint.x,
              clientY: startPoint.y,
              button: 0,
              buttons: 1,
              pointerType: "mouse",
              bubbles: true,
              cancelable: true,
            }),
          );
          canvas.dispatchEvent(
            new PointerEvent("pointermove", {
              pointerId: 111,
              clientX: startPoint.x + 40,
              clientY: startPoint.y + 20,
              button: 0,
              buttons: 1,
              pointerType: "mouse",
              bubbles: true,
              cancelable: true,
            }),
          );
          canvas.dispatchEvent(
            new PointerEvent("pointerup", {
              pointerId: 111,
              clientX: startPoint.x + 40,
              clientY: startPoint.y + 20,
              button: 0,
              buttons: 0,
              pointerType: "mouse",
              bubbles: true,
              cancelable: true,
            }),
          );
          check("拖动节点", Math.abs(dragNode.x - startX) > 1);

          const edgeCount = doc.edges.length;
          mode = "connect";
          connectFrom = null;
          const a = doc.nodes[1];
          const b = doc.nodes[2];
          const pa = worldToScreen(a.x + a.w / 2, a.y + a.h / 2);
          const pb = worldToScreen(b.x + b.w / 2, b.y + b.h / 2);
          tapAt(pa.x, pa.y, 121);
          tapAt(pb.x, pb.y, 122);
          check("连线模式建立连线", doc.edges.length === edgeCount + 1);
          mode = "select";
          connectFrom = null;
          updateUI();

          const sampleEdge = doc.edges[0];
          const edgePoints = edgeScreenPoints(sampleEdge);
          const edgeMid = quadraticPoint(edgePoints.p1, edgePoints.control, edgePoints.p2, 0.5);
          check("命中连线", !!hitEdge(edgeMid.x, edgeMid.y));
          const edgeCountBeforeDelete = doc.edges.length;
          removeEdge(sampleEdge);
          check("删除连线", doc.edges.length === edgeCountBeforeDelete - 1);
          undo();

          const camXBefore = cam.x;
          const panStart = { x: 430, y: 760 };
          const panId = 131;
          const panInit = {
            pointerId: panId,
            clientX: panStart.x,
            clientY: panStart.y,
            button: 0,
            buttons: 1,
            pointerType: "touch",
            bubbles: true,
            cancelable: true,
          };
          canvas.dispatchEvent(new PointerEvent("pointerdown", panInit));
          canvas.dispatchEvent(
            new PointerEvent("pointermove", {
              ...panInit,
              clientX: panStart.x - 30,
              clientY: panStart.y,
            }),
          );
          canvas.dispatchEvent(
            new PointerEvent("pointerup", {
              ...panInit,
              clientX: panStart.x - 30,
              clientY: panStart.y,
              buttons: 0,
            }),
          );
          check("单指平移", Math.abs(cam.x - camXBefore) > 5);

          const scaleBefore = cam.scale;
          const touchDown = (id, x, y) =>
            canvas.dispatchEvent(
              new PointerEvent("pointerdown", {
                pointerId: id,
                clientX: x,
                clientY: y,
                button: 0,
                buttons: 1,
                pointerType: "touch",
                bubbles: true,
                cancelable: true,
              }),
            );
          const touchMove = (id, x, y) =>
            canvas.dispatchEvent(
              new PointerEvent("pointermove", {
                pointerId: id,
                clientX: x,
                clientY: y,
                button: 0,
                buttons: 1,
                pointerType: "touch",
                bubbles: true,
                cancelable: true,
              }),
            );
          const touchUp = (id, x, y) =>
            canvas.dispatchEvent(
              new PointerEvent("pointerup", {
                pointerId: id,
                clientX: x,
                clientY: y,
                button: 0,
                buttons: 0,
                pointerType: "touch",
                bubbles: true,
                cancelable: true,
              }),
            );
          touchDown(201, 200, 700);
          touchDown(202, 300, 700);
          touchMove(201, 150, 700);
          touchMove(202, 350, 700);
          check("双指缩放", cam.scale > scaleBefore + 0.05);
          touchUp(201, 150, 700);
          touchUp(202, 350, 700);

          zoomAt(250, 400, 0.00001);
          check("最小缩放 1%", cam.scale >= 0.01 - 1e-9);
          zoomAt(250, 400, 1e9);
          check("最大缩放 12800%", cam.scale <= 128 + 1e-9);
          fitView();

          const groupNodes = doc.nodes.slice(0, 2);
          selectedIds = new Set(groupNodes.map((node) => node.id));
          groupSelectedNodes();
          const outerGroup = doc.groups[doc.groups.length - 1];
          check(
            "新建分组",
            doc.groups.length >= 1 && groupNodes.every((node) => node.parentId === outerGroup.id),
          );
          const childNode = groupNodes[0];
          selectedIds = new Set([childNode.id]);
          groupSelectedNodes();
          const innerGroup = doc.groups[doc.groups.length - 1];
          check(
            "嵌套分组",
            innerGroup.parentId === outerGroup.id && childNode.parentId === innerGroup.id,
          );
          toggleGroupCollapse(outerGroup);
          check("折叠隐藏后代", isNodeHidden(childNode));
          toggleGroupCollapse(outerGroup);
          check("展开恢复后代", !isNodeHidden(childNode));
          const marqueeBox = { startX: 0, startY: 0, x: viewport.w, y: viewport.h };
          check("框选命中节点", nodesInMarquee(marqueeBox).length === doc.nodes.length);

          const boundsBeforeDrag = computeGroupBounds().expanded(outerGroup.id);
          const titlePoint = worldToScreen(boundsBeforeDrag.x + 20, boundsBeforeDrag.y + 20);
          const childBefore = { x: childNode.x, y: childNode.y };
          const groupDown = {
            pointerId: 401,
            clientX: titlePoint.x,
            clientY: titlePoint.y,
            button: 0,
            buttons: 1,
            pointerType: "mouse",
            bubbles: true,
            cancelable: true,
          };
          canvas.dispatchEvent(new PointerEvent("pointerdown", groupDown));
          canvas.dispatchEvent(
            new PointerEvent("pointermove", {
              ...groupDown,
              clientX: titlePoint.x + 30,
              clientY: titlePoint.y + 20,
              buttons: 1,
            }),
          );
          canvas.dispatchEvent(
            new PointerEvent("pointerup", {
              ...groupDown,
              clientX: titlePoint.x + 30,
              clientY: titlePoint.y + 20,
              buttons: 0,
            }),
          );
          check("拖动分组", Math.abs(childNode.x - childBefore.x) > 1);

          const boundsAfterDrag = computeGroupBounds().expanded(outerGroup.id);
          const moveNode = doc.nodes[2];
          const nodeCenter = worldToScreen(
            moveNode.x + moveNode.w / 2,
            moveNode.y + moveNode.h / 2,
          );
          const targetWorld = {
            x: boundsAfterDrag.x + boundsAfterDrag.w / 2,
            y: boundsAfterDrag.y + boundsAfterDrag.h / 2,
          };
          const targetScreen = worldToScreen(targetWorld.x, targetWorld.y);
          const nodeDown = {
            pointerId: 402,
            clientX: nodeCenter.x,
            clientY: nodeCenter.y,
            button: 0,
            buttons: 1,
            pointerType: "mouse",
            bubbles: true,
            cancelable: true,
          };
          canvas.dispatchEvent(new PointerEvent("pointerdown", nodeDown));
          canvas.dispatchEvent(
            new PointerEvent("pointermove", {
              ...nodeDown,
              clientX: targetScreen.x,
              clientY: targetScreen.y,
              buttons: 1,
            }),
          );
          canvas.dispatchEvent(
            new PointerEvent("pointerup", {
              ...nodeDown,
              clientX: targetScreen.x,
              clientY: targetScreen.y,
              buttons: 0,
            }),
          );
          check("节点拖入分组", !!moveNode.parentId);

          ungroupGroup(outerGroup.id, false);
          check("解散保留内容", !groupById(outerGroup.id) && !!nodeById(childNode.id));
          commitHistory();
          saveLater();

          const firstCanvasId = activeCanvasId;
          const firstCanvasNodes = doc.nodes.length;
          createCanvas();
          check("新建空白画布", doc.nodes.length === 0 && canvasIndex.length >= 2);
          switchCanvas(firstCanvasId);
          check(
            "切换回原画布",
            activeCanvasId === firstCanvasId && doc.nodes.length === firstCanvasNodes,
          );

          saveNow();
          let savedCount = -1;
          let savedGroups = -1;
          try {
            const saved = JSON.parse(
              localStorage.getItem(STORAGE_DOC_PREFIX + activeCanvasId),
            );
            savedCount = saved.nodes.length;
            savedGroups = (saved.groups || []).length;
          } catch (error) {
            savedCount = -1;
            savedGroups = -1;
          }
          check("写入 localStorage", savedCount === doc.nodes.length);
          check("写入分组", savedGroups === doc.groups.length);

          const candidates = [];
          for (let y = 150; y < viewport.h - 160; y += 70) {
            for (let x = 24; x < viewport.w - 24; x += 70) {
              candidates.push([x, y]);
            }
          }
          const marqueeStart = candidates.find(
            ([x, y]) => !hitNode(x, y) && !hitGroupTitle(x, y) && !hitEdge(x, y),
          );
          if (marqueeStart) {
            const [sx, sy] = marqueeStart;
            const ex = sx < viewport.w / 2 ? viewport.w - 24 : 24;
            const ey = sy < viewport.h / 2 ? viewport.h - 160 : 140;
            const down = {
              pointerId: 301,
              clientX: sx,
              clientY: sy,
              button: 0,
              buttons: 1,
              pointerType: "mouse",
              bubbles: true,
              cancelable: true,
            };
            canvas.dispatchEvent(new PointerEvent("pointerdown", down));
            await new Promise((resolve) => setTimeout(resolve, 620));
            canvas.dispatchEvent(
              new PointerEvent("pointermove", {
                ...down,
                clientX: ex,
                clientY: ey,
                buttons: 1,
              }),
            );
            canvas.dispatchEvent(
              new PointerEvent("pointerup", {
                ...down,
                clientX: ex,
                clientY: ey,
                buttons: 0,
              }),
            );
            check("长按框选选中节点", selectedIds.size > 0);
          } else {
            check("长按框选选中节点", false);
          }

          const passed = results.filter((r) => r.pass).length;
          document.title = JSON.stringify({ passed, total: results.length, results });
        }

        function init() {
          const params = new URLSearchParams(location.search);
          if (window.HuabuAndroid) document.body.classList.add("android");
          if (params.has("selftest")) {
            clearAllStorage();
          }

          resize();
          makePaperPattern();
          cam.x = viewport.w / 2;
          cam.y = viewport.h / 2;
          cam.scale = 1;
          initializeCanvases();
          resetHistory();
          bindEvents();
          updateUI();
          requestRender();

          if (params.has("selftest")) {
            setTimeout(runSelfTest, 50);
          }
        }

        init();
      })();
    </script>
  </body>
</html>
